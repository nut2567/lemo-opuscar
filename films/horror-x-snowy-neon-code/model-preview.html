<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character model preview</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
svg{display:block}
</style>
<div id="stage"><svg id="portrait" viewBox="-140 -130 280 540" width="840" height="1620"></svg></div>
<script type="module">
// model-preview — reusable person-only registry preview for the main film.
// ?model=cel is the default; ?model=noon selects the preserved previous rig.
// The registry returns an SVG inner fragment in world coordinates anchored at
// the head center; uid 'preview' namespaces every id for deterministic output.
import { DEFAULT_MODEL, getCharacterModel, renderCharacter } from '../../models/registry.mjs';

const params = new URLSearchParams(location.search);
const model = getCharacterModel(params.get('model') || DEFAULT_MODEL);
const svg = document.getElementById('portrait');
// Noon leans while counting; allow room for the original rig's full silhouette.
if (model.id === 'noon') svg.setAttribute('viewBox', '-220 -170 480 925');

window.DUR = 7.5;
window.MODEL = model.id;
window.MODEL_NAME = model.name;
window.MODEL_NAME_EN = model.nameEn;
window.render = function (t) {
  t = Math.max(0, Math.min(window.DUR - 1 / 3000, Number(t) || 0));
  svg.innerHTML = renderCharacter(t, { model: model.id, uid: 'preview', x: 0, y: 0, scale: 1 });
};
window.render(3.7);
window.READY = true;
// Explicit opt-in playback; review captures call render(t) directly.
if (new URLSearchParams(location.search).has('play')) {
  const start = performance.now();
  function tick() { window.render(((performance.now() - start) / 1000) % window.DUR); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
}
</script></html>
