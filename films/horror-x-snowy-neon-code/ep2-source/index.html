<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horror X EP2 · ประตูหลัง</title>
<style>
  /* CSS url() resolves against the document URL at parse time (before the
     runtime <base>), so this is relative to ep2-source/: up one = film root. */
  @font-face { font-family: CaptionKanit; src: url('../assets/fonts/Kanit-Regular.ttf') format('truetype'); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1838; }
  #film, #nunLayer, #insert, #front, #shot, #shotSvg { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* Layer stack (z-index). Back wall z0 and rear door z1 are the lowest
     elements, painted first inside #film; the person is z50; in-room inserts
     (coins, washer details) z55; the shop-front glazing / front door frame is
     z100 and nothing exceeds it. Full-frame insert shots (#shot, #shotSvg)
     replace the storefront layers while active and keep the same rule
     inside their own composition. */
  #film { z-index: 10; }
  #nunLayer { z-index: 50; }
  #insert { z-index: 55; }
  #front { z-index: 100; }
  #shot, #shotSvg { z-index: 100; }
  #caption { z-index: 100; }
  #shotSvg svg { display: block; width: 100%; height: 100%; }
  /* Compact captions (CAPTION-DIRECTION.md + size review): Kanit Regular,
     one row per cue, bottom band ~y1724-1764, tight translucent backing
     hugging the text. Default 22.4 px on 1080x1920 = 2.0741vw — the
     smallest of {19.2, 22.4, 24} that restores Thai tone-mark rows at
     390 px phone scale (see evidence/34/capcmp/). ?capvw= overrides. */
  #caption { position: fixed; bottom: 8.168%; left: 0; right: 0; text-align: center; color: #EAF4FF; }
  #caption span { display: inline-block; padding: .30em .74em .34em; border-radius: .42em;
    background: rgba(20,35,51,.55); border: .8px solid rgba(51,72,95,.35);
    font-family: CaptionKanit, sans-serif; font-size: var(--cap-size, 2.0741vw); line-height: 1.28;
    text-wrap: balance; overflow-wrap: anywhere; }
</style>
<canvas id="film"></canvas>
<svg id="nunLayer" viewBox="0 0 1080 1920" preserveAspectRatio="none"><g id="nunCam"></g></svg>
<canvas id="insert" hidden></canvas>
<canvas id="front"></canvas>
<canvas id="shot" hidden></canvas>
<div id="shotSvg" hidden></div>
<div id="caption" hidden><span></span></div>
<script type="module" src="./entry.mjs"></script>
</html>
