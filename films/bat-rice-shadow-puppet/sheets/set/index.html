<!doctype html>
<html><head><meta charset="utf-8">

<script type="module">
import { sheet } from '../harness.js';
import * as S from '../../set.js';
S.buildSet();
sheet(g => {
  S.drawSky(g, { kind: 'sun', x: 200, y: 250 });

  S.drawField(g, { t: 0, grow: 1, gold: 1, x0: 540, x1: 1080 });
  S.drawBugs(g, { t: .4, n: 5, cx: 400, cy: 800 });
  S.drawRain(g, { t: 0, amount: .6 });
});
