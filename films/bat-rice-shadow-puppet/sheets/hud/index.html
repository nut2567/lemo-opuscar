<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>html,body{margin:0;background:#0d0805}canvas{display:block}</style>
</head><body>
<script type="module">
import { sheet } from '../harness.js';
import { loadFonts, buildPlaque, drawPlaque, drawSub, drawFrame } from '../../hud.js';
await loadFonts();
buildPlaque();
sheet(
  g => {
    drawPlaque(g, { x: 540, y: 420, press: 1 });
    drawPlaque(g, { x: 540, y: 1120, s: 0.85, press: 0.4 });
  },
  f => {
    drawFrame(f, { a: 0.9 });
    drawSub(f, 'จากค้างคาว ชาวบ้านเลยเรียกใหม่ว่า ค้างข้าว!');
  }
);
</script></body></html>
