<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{position:absolute;left:0;top:0}</style></head><body>
<script type="module">
import { sheet } from '../harness.js';
import * as C from '../../cast.js';
import { DYE } from '../../carve.js';
C.buildCast();
const poses = [
  { wingL: 0, wingR: 0 },
  { wingL: 1, wingR: 1, hat: true, hold: 'seedling', ears: 1, eyes: 'wide' },
  { hat: true, hold: 'sickle', wingR: .5, flip: -1 },
  { eyes: 'dizzy', dizzy: 1, wingL: .5, wingR: .7 },
];
const Y = [300, 800, 1300, 1750];
sheet(g => {
  // busy backdrop: vertical dye stripes + black horizontal bars (multiply on the white cloth)
  const cols = [DYE.green, DYE.brown, DYE.blue, DYE.red, DYE.teal];
  for (let i = 0; i < cols.length; i++) { g.fillStyle = cols[i]; g.fillRect(i * 216, 0, 216, 1920); }
  g.fillStyle = '#000';
  for (let y = 120; y < 1900; y += 260) g.fillRect(0, y, 1080, 26);
  poses.forEach((p, i) => {
    C.drawBat(g, { x: 270, y: Y[i], s: 1.15, ...p });
    C.drawBat(g, { x: 810, y: Y[i], s: 1.15, ...p }, { opaque: true, halo: .8 });
  });
});
</script></body></html>
