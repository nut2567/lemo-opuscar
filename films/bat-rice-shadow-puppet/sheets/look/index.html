<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0d0805}canvas{display:block}</style>
</head><body>
<script type="module">
// Look sheet for the Revision-2 gl.js features: hero layer, sky tint, stars, vignette colour.
// t < 1 = day, t >= 1 = night. Self-contained: no cast.js, no harness.js.
import { makeGL } from '../../gl.js';
import { canvas, piece, drawPiece, fill, within, ink } from '../../carve.js';
import * as set from '../../set.js';

const W = 1080, H = 1920;
const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.id = 'gl'; document.body.appendChild(cv);
const GL = makeGL(cv);
const [trc, tr] = canvas(W, H), [frc, fr] = canvas(W, H), [heroc, hero] = canvas(W, H);
set.buildSet();

// Test puppet on the hero layer: alpha = full silhouette coverage, colour = transmittance
// (plum dyed hide, white inside the lattice holes so lit cloth shows through).
const PUP = piece([-175, -175, 175, 175], g => {
  const disc = q => q.arc(0, 0, 150, 0, Math.PI * 2);
  fill(g, '#ffffff', disc);                                   // white-solid silhouette first
  g.globalCompositeOperation = 'multiply';
  fill(g, '#3d2270', disc);                                   // then the dyed plum multiplied on
  g.globalCompositeOperation = 'source-over';
  within(g, disc, () => {                                     // lattice holes: carved out → white (fully transparent)
    const s = 10, w = 2.2, x0 = -142, y0 = -142, x1 = 142, y1 = 142;
    let row = 0; g.beginPath();
    for (let y = y0; y < y1 + s; y += s / 2, row++)
      for (let x = x0 + (row % 2) * s / 2; x < x1 + s; x += s) {
        const h = s / 2 - w;
        g.moveTo(x, y - h * .9); g.lineTo(x + h, y); g.lineTo(x, y + h * .9); g.lineTo(x - h, y); g.closePath();
      }
    g.fillStyle = '#fff'; g.fill('nonzero');
  });
  ink(g, 3.6, disc);                                          // dark carved outline
}, { seed: 5 });
// hero canvas is transparent; draw the puppet once, centred on the canopy
hero.setTransform(1, 0, 0, 1, 0, 0); hero.clearRect(0, 0, W, H);
hero.save(); hero.translate(760, 500); drawPiece(hero, PUP); hero.restore();

const DAY = {
  lamps: [[250, 520, 1, .95], [830, 520, 1, .95], [250, 1280, 1, .95], [830, 1280, 1, .95]],
  sigB: 950, sigC: 190, amb: .3, lcol: [1, .9, .74], expo: .42, bloom: .16,
  heroKey: .5, heroShadow: .5,
};
const NIGHT = {
  lamps: [[760, 330, 1.3, .95]],
  sigB: 950, sigC: 190, amb: .3, lcol: [.8, .88, 1], hotcol: [1, .95, .8], expo: 1.1,
  skyTop: [.10, .20, .62], skyBot: [.34, .50, .95], skyY: [0, 1400],
  stars: 1, vcol: [.22, .32, .62], bcol: [.7, .8, 1], bloom: .22,
  heroKey: .85, heroShadow: .6,
};

const NOHERO = new URLSearchParams(location.search).has('nohero');
window.render = t => {
  const night = t >= 1;
  tr.setTransform(1, 0, 0, 1, 0, 0); tr.globalCompositeOperation = 'source-over'; tr.globalAlpha = 1; tr.filter = 'none';
  tr.fillStyle = '#fff'; tr.fillRect(0, 0, W, H); tr.globalCompositeOperation = 'multiply';
  if (night) set.drawSky(tr, { kind: 'moon', x: 760, y: 330 });
  else set.drawSky(tr, { kind: 'sun', x: 300, y: 330 });
  set.drawTree(tr, { x: 820, sacks: 4, t });
  set.drawField(tr, { t, grow: 1, gold: night ? .4 : .7, wind: .1, x0: 0, x1: W });
  tr.globalCompositeOperation = 'source-over';
  fr.setTransform(1, 0, 0, 1, 0, 0); fr.clearRect(0, 0, W, H);
  GL.render(trc, frc, {
    cam: [540, 960, 1], rect: [0, 0, W, H], time: t, cloth: 1, vign: .4, sat: 1.05, contrast: .12,
    ...(NOHERO ? {} : { hero: heroc }),
    ...(night ? NIGHT : DAY),
  });
};
window.DUR = 2; window.READY = true;
</script></body></html>
