<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character proof — ORIGINAL NUN vs UPDATED CLOTH</title>
<style>
html,body{margin:0;height:100%;background:#162333;overflow:hidden}
#stage{position:relative;width:1600px;height:1000px;margin:0 auto;top:50%;transform:translateY(-50%)}
.col{position:absolute;top:0;width:800px;height:1000px}
#colL{left:0}#colR{left:800px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(160,185,215,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(160,185,215,.05) 1px,transparent 1px);background-size:50px 50px}
.tag{position:absolute;top:22px;left:0;width:800px;text-align:center;font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.28em;color:#9db1c9}
#nunLayer{position:absolute;inset:0;width:800px;height:1000px}
#cloth{position:absolute;inset:0;width:800px;height:1000px}
.ground{position:absolute;left:0;top:799px;width:800px;height:1px;background:rgba(170,190,215,.28)}
</style>
<div id="stage">
<div class="col" id="colL"><div class="grid"></div><div class="tag">ORIGINAL NUN</div><svg id="nunLayer" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"></svg><div class="ground"></div></div>
<div class="col" id="colR"><div class="grid"></div><div class="tag">UPDATED CLOTH</div><canvas id="cloth" width="800" height="1000"></canvas><div class="ground"></div></div>
</div>
<script type="module" src="./character-proof.mjs"></script></html>
