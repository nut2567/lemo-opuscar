<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cel woman — person-only preview</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
svg{display:block}
</style>
<div id="stage"><svg id="portrait" viewBox="-140 -130 280 540" width="840" height="1620"></svg></div>
<script type="module">
// character-preview — PERSON ONLY: the corrected cel woman (pale skin, slim
// face) with no scene, shop, ghost, weather or reflection. Driven by
// celWomanMarkup(t=3.7, {x:0, y:0, scale:1, uid:'portrait'}); the skin/face
// corrections live in assets/cel-face.js and assets/cel-body.js. Pure
// function of t; window.render(t) is synchronous. Transparent stage.
import { celWomanMarkup } from './assets/cel-woman.js';

const svg = document.getElementById('portrait');
window.DUR = 7.5;
window.render = function (t) {
  t = Math.max(0, Math.min(window.DUR - 1 / 3000, Number(t) || 0));
  svg.innerHTML = celWomanMarkup(t, { x: 0, y: 0, scale: 1, uid: 'portrait' });
};
window.render(3.7);
window.READY = true;
// Explicit opt-in playback; review captures call render(t) directly.
if (new URLSearchParams(location.search).has('play')) {
  const start = performance.now();
  function tick() { window.render(((performance.now() - start) / 1000) % window.DUR); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
}
</script></html>
