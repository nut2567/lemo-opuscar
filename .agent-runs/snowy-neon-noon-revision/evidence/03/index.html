<!doctype html>
<html><head><meta charset="utf-8"><title>washer-row stills</title>
<style>
  @font-face { font-family: Kanit; src: url('../../../../films/horror-x-snowy-neon-code/assets/fonts/Kanit-Regular.ttf') format('truetype'); }
  html,body{margin:0;background:#000}
  canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { drawWasherRowShot } from '../../../../films/horror-x-snowy-neon-code/ep1-source/noon/washer-row.mjs';
const ctx = document.querySelector('#c').getContext('2d');
const T0 = 14.47, T1 = 17.25;
window.render = seconds => {
  const s = Number(seconds) || 0;
  const progress = Math.max(0, Math.min(1, (s - T0) / (T1 - T0)));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawWasherRowShot(ctx, { seconds: s, progress, width: 1080, height: 1920 });
  return { seconds: s, progress };
};
await document.fonts.load('12px Kanit');
window.READY = true;
</script></body></html>
