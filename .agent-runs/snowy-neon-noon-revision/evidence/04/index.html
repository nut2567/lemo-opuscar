<!doctype html>
<html><head><meta charset="utf-8"><title>coin-macro stills</title>
<style>
  html,body{margin:0;background:#000}
  canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { drawCoinMacroShot } from '../../../../films/horror-x-snowy-neon-code/ep1-source/noon/coin-macro.mjs';
const ctx = document.querySelector('#c').getContext('2d');
window.render = seconds => {
  const s = Number(seconds) || 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawCoinMacroShot(ctx, { seconds: s, width: 1080, height: 1920 });
  return { seconds: s };
};
window.READY = true;
