<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { drawWashers } from '/films/horror-x-snowy-neon-code/washers.mjs';
const g = document.getElementById('c').getContext('2d');
// Approximate interior backdrop: wall + floor tones from environment.mjs.
g.fillStyle = '#33261b'; g.fillRect(0, 0, 1080, 1164);
g.fillStyle = '#2a1e15'; g.fillRect(0, 1164, 1080, 756);
const lg = g.createLinearGradient(0, 1090, 0, 1164);

window.READY = true;
window.sample = () => {
